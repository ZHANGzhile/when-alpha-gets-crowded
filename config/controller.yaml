schema_version: 1
prediction_target: active_long_crash_20d
information_models: [M2, M3, M4]
primary_policy:
  type: historical_risk_percentile_tiers
  minimum_history_weeks: 52
  tiers:
    - {upper_percentile: 0.60, active_weight: 1.00}
    - {upper_percentile: 0.80, active_weight: 0.75}
    - {upper_percentile: 0.90, active_weight: 0.50}
    - {upper_percentile: 1.00, active_weight: 0.25}
sensitivity_policy:
  type: clipped_one_minus_probability
  minimum_active_weight: 0.25
cost_bps:
  primary: 10
  sensitivity: [5, 20]
primary_application_metric: net_information_ratio
guardrails: [active_mdd_not_worse, active_cvar_not_worse]
reference_data:
  provider: tushare_pro
  benchmark_index_code: 000906.SH
  benchmark_weight_endpoint: index_weight
  benchmark_anchor_frequency: monthly
  opening_limit_endpoint: stk_limit
  opening_limit_available_time: "09:00:00 Asia/Shanghai"
  execution_time: "09:30:00 Asia/Shanghai"
  required_minimum_points: 2000
benchmark_replication_audit:
  maximum_gross_tracking_error: 0.01
  maximum_net_tracking_error: 0.02
  maximum_absolute_gross_annualized_relative_return: 0.01
