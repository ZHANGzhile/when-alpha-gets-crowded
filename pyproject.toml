[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-crowding"
version = "0.1.0"
description = "Reproducible research system for market-implied factor crowding and alpha fragility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "baostock>=0.8.9",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

